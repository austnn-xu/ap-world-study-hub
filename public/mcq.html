<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MCQ Practice | AP World Study Hub</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body data-practice-type="mcq">
    <header class="site-header">
      <a class="brand" href="/"><span class="brand-mark">WH</span><span>AP World Study Hub</span></a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a class="active" href="/mcq">MCQ</a>
        <a href="/saq">SAQ</a>
        <a href="/dbq">DBQ</a>
        <a href="/leq">LEQ</a>
        <a href="/timeline">Timeline</a>
      </nav>
    </header>
    <main class="practice-layout">
      <section class="page-intro">
        <p class="eyebrow">Multiple choice</p>
        <h1>MCQ Practice</h1>
        <p>Generate AP-style question sets and keep a review queue of every question you miss.</p>
      </section>
      <section class="practice-workbench">
        <aside class="control-panel">
          <label>Topic focus <input id="topicInput" type="text" placeholder="Silk Roads, revolutions, decolonization"></label>
          <label>Period
            <select id="periodInput">
              <option>Any AP World period</option>
              <option>Period 1: c. 1200-c. 1450</option>
              <option>Period 2: c. 1450-c. 1750</option>
              <option>Period 3: c. 1750-c. 1900</option>
              <option>Period 4: c. 1900-present</option>
            </select>
          </label>
          <label>Difficulty
            <select id="difficultyInput">
              <option>AP exam style</option>
              <option>Foundational</option>
              <option>Challenging</option>
              <option>Mixed difficulty</option>
            </select>
          </label>
          <button id="generateButton" class="primary-action" type="button">Generate Questions</button>
          <button id="reviewMissedButton" class="secondary-action" type="button">Review Missed MCQs</button>
          <p class="small-note"><span data-missed-count>0</span> missed questions saved in this browser.</p>
        </aside>
        <section class="question-panel" aria-live="polite">
          <div id="emptyState" class="empty-state">
            <h2>Ready when you are.</h2>
            <p>Start a new set or revisit the questions you missed.</p>
          </div>
          <div id="questionArea" hidden></div>
        </section>
      </section>
    </main>
    <script src="/app.js"></script>
    <script src="/practice.js"></script>
  </body>
</html>
